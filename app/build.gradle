plugins {
    id "com.android.application"
}

def signingPropertiesPath = providers.gradleProperty("receiptorySigningProperties").orNull

android {
    namespace "se.lecani.Receiptory"
    compileSdk 35

    defaultConfig {
        applicationId "se.lecani.Receiptory"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    if (signingPropertiesPath != null) {
        def configFile = rootProject.file(signingPropertiesPath)
        def keys = new Properties()
        configFile.withInputStream { keys.load(it) }
        def keyFile = new File(keys.getProperty("storeFile"))
        signingConfigs {
            release {
                storeFile (keyFile.isAbsolute() ? keyFile : new File(configFile.parentFile, keyFile.path))
                storePassword keys.getProperty("storePassword")
                keyAlias keys.getProperty("keyAlias")
                keyPassword keys.getProperty("keyPassword")
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def cameraxVersion = "1.4.1"

    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
